syntax = "proto3";

package meter.v1;

option cc_enable_arenas = true;

import "common/v1/error.proto";
import "meter/v1/meter.proto";

// IngestService accepts new meter data & simulates the edge
service IngestService {
  // Ingest a single meter reading. Internally calls NATS publisher service.
  rpc IngestReading(IngestReadingRequest) returns (IngestReadingResponse);
}

message IngestReadingRequest {
  MeterReading reading = 1;
}

message IngestReadingResponse {
  bool accepted = 1;
  string message_id = 2;        // NATS message sequence if published
  common.v1.DomainError error = 3;
}
