services:
  nats:
    image: nats:2.10-alpine
    container_name: nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build: .
    image: jet-clickhouse:latest
    container_name: nats-publisher
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      GRPC_ADDR: 0.0.0.0:50051
      SERVICE_BIN: nats_publisher
    ports:
      - "50051:50051"

  ingest-server:
    image: jet-clickhouse:latest
    container_name: ingest-server
    depends_on:
      - nats-publisher
    environment:
      PUBLISHER_ADDR: nats-publisher:50051
      GRPC_ADDR: 0.0.0.0:50052
      SERVICE_BIN: ingest_server
    ports:
      - "50052:50052"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-consumer:
    image: jet-clickhouse:latest
    container_name: clickhouse-consumer
    restart: unless-stopped
    depends_on:
      - nats-publisher
      - clickhouse
    environment:
      NATS_URL: nats://nats:4222
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
      SERVICE_BIN: clickhouse_consumer

  consumer:
    image: jet-clickhouse:latest
    container_name: consumer
    depends_on:
      - nats-publisher
    environment:
      NATS_URL: nats://nats:4222
      SERVICE_BIN: consumer

  client:
    image: jet-clickhouse:latest
    container_name: client
    profiles: ["client"]
    depends_on:
      - ingest-server
    environment:
      INGEST_ADDR: ingest-server:50052
      SERVICE_BIN: client

volumes:
  nats-data:
  clickhouse-data:
