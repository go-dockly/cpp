syntax = "proto3";

package nats.v1;

option cc_enable_arenas = true;

import "common/v1/error.proto";
import "meter/v1/meter.proto";

// NatsPublisherService is a dedicated service that owns the NATS / JetStream connection
// and publishes domain events. Keeps the ingest path clean and allows independent scaling.
service NatsPublisherService {
  rpc PublishMeterReading(PublishMeterReadingRequest) returns (PublishMeterReadingResponse);
}

message PublishMeterReadingRequest {
  meter.v1.MeterReading reading = 1;
  string subject = 2; // optional override, default "meter.reading"
}

message PublishMeterReadingResponse {
  bool published = 1;
  string subject = 2;
  uint64 sequence = 3;          // JetStream sequence number
  common.v1.DomainError error = 4;
}
